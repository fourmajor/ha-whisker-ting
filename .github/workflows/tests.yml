name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-test.txt

      - name: Lint
        run: >-
          ruff check
          custom_components/whisker_ting/protocol.py
          custom_components/whisker_ting/websocket.py
          tests

      - name: Test
        run: pytest
